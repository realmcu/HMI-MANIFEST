manifest:

    remotes:
      - name: origin
        url-base: ssh://cn4soc.rtkbf.com:29418
      - name: gitee
        url-base: https://gitee.com
      - name: github
        url-base: https://github.com

    defaults:
      remote: origin

    projects:
      - name: honeycomb
        repo-path: HoneyComb
        revision: release/crb-3.14.0
        path: honeycomb

      - name: hmi
        repo-path: HoneyRepo/hmi
        revision: rtl8773e-dashboard
        path: honeycomb/sdk/board/evb/hmi_dashboard
        west-commands: west_commands_extention/west-commands.yml

      - name: ui
        remote: github
        repo-path: realmcu/honeygui-template-dashboard
        revision: dev_lite
        path: honeycomb/sdk/board/evb/hmi_dashboard/src/application/designer

    self:
        path: .manifest
