manifest:

    remotes:
      - name: github
        url-base: https://github.com
      - name: gitee
        url-base: ssh://git@gitee.com

    defaults:
      remote: gitee

    projects:
      - name: rtl87x3g-common-sdk
        remote: github
        repo-path: rtkconnectivity/rtl87x3g-zsdk
        revision: common/v1.0.0.21
        path: zephyrproject/realtek-app
        import:
            file: west.yml
            path-prefix: .
            name-allowlist:
              - cmsis
              - fatfs
              - hal_realtek
              - mbedtls
              - tinycrypt
              - zephyr

      - name: display
        repo-path: realmcu/display
        revision: f26d611eb42c98d73265f595abfbf950a63b0760
        path: zephyrproject/modules/display

      - name: honeygui
        repo-path: realmcu/HoneyGUI
        revision: 3a9e5a6de57c243f4f23dc3c762240e3ba9405a6
        path: zephyrproject/modules/honeygui

      - name: hmi
        repo-path: realmcu/hmi
        revision: 48f0fe7413d2b1c10fce713cbd149e693975b828
        path: zephyrproject/realtek-app/applications/dashboard
        
      - name: honeygui-dashboard-ui
        repo-path: realmcu/honeygui-template-dashboard
        revision: edd82a63f276df7e4cf758f2b1a6d545e02a01e8
        path: zephyrproject/realtek-app/applications/dashboard/ui_design

    self:
        path: .manifest
