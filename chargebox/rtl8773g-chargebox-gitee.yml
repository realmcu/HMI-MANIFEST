manifest:

    remotes:
      - name: github
        url-base: https://github.com
      - name: gitee
        url-base: ssh://git@gitee.com

    defaults:
      remote: gitee

    projects:
      - name: rtl87x3g-common-sdk
        remote: github
        repo-path: rtkconnectivity/rtl87x3g-zsdk
        revision: common/v1.0.0.21
        path: zephyrproject/realtek-app
        import:
            file: west.yml
            path-prefix: .
            name-allowlist:
              - cmsis
              - fatfs
              - hal_realtek
              - mbedtls
              - tinycrypt
              - zephyr

      - name: display
        repo-path: realmcu/display
        revision: master
        path: zephyrproject/modules/display

      - name: honeygui
        repo-path: realmcu/HoneyGUI
        revision: master
        path: zephyrproject/modules/honeygui

      - name: lvgl
        repo-path: realmcu/lvgl
        revision: 6ba2451d3c10e445d525fdf0a57a4dcf193300ae
        path: zephyrproject/modules/lvgl

      - name: hmi
        repo-path: realmcu/hmi
        revision: rtl8773g-chargebox
        path: zephyrproject/realtek-app/applications/chargebox

    self:
        path: .manifest
