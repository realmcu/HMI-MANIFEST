manifest:

    remotes:
      - name: origin
        url-base: ssh://cn4soc.rtkbf.com:29418
      - name: gitee
        url-base: ssh://git@gitee.com

    defaults:
      remote: origin

    projects:
      # SDK versions are based on the bb2u-sdk-hmi-v0.0.0.1 release manifest.
      # Display carries the accelerator API updates required by HoneyGUI
      # master, so both are kept on their floating master branches.
      - name: zephyr
        repo-path: HoneyRepo/zephyr
        revision: realtek-main-v3.7
        path: zephyr
        import:
            file: test.yml
            path-prefix: zephyrproject
            name-allowlist:
              - cmsis

      - name: hal_realtek
        repo-path: HoneyRepo/zephyr-hal
        revision: fb34f76a88a179fc006551ea474c2b3f534300df
        path: zephyrproject/modules/hal/realtek

      # Merged rebase of Gerrit change 363438 (patchset 8), the commit that
      # actually landed on master. Do not pin to a patchset SHA such as
      # refs/changes/38/363438/7: west only fetches branches and tags, so an
      # unmerged or rebased-away patchset is unreachable and update fails.
      - name: realtek-app
        repo-path: HoneyRepo/realtek-zephyr-project
        revision: 9d8248a02f504e0cdf6f75d950c06172e25df75f
        path: zephyrproject/realtek-app

      - name: display
        repo-path: HoneyRepo/driver/display
        revision: master
        path: zephyrproject/modules/display

      - name: honeygui
        repo-path: HoneyGUI
        revision: master
        clone-depth: 1
        path: zephyrproject/modules/honeygui

      - name: hmi
        repo-path: HoneyRepo/hmi
        revision: RTL8773GTP-WATCH-360X360
        path: applications

      - name: hmi-script
        repo-path: HoneyRepo/hmi
        revision: script
        clone-depth: 1
        path: applications/scripts

      - name: rtl87x3-hmi-posix
        repo-path: HoneyRepo/hmi
        revision: posix-device
        path: posix

      - name: rtl87x3-hmi-protocol
        repo-path: HoneyRepo/hmi
        revision: rtl87x3-hmi-protocol
        path: protocol

      - name: FlashDB
        repo-path: HoneyRepo/hmi
        revision: FlashDB
        path: FlashDB

      - name: gsensor-algorithm
        remote: gitee
        repo-path: realmcu_admin/gsensor-algorithm
        revision: master
        path: gsensor-algorithm

      - name: watch_ui
        remote: gitee
        repo-path: priodigit/smartwatchui360360
        revision: master
        path: ui


    self:
        path: .manifest
