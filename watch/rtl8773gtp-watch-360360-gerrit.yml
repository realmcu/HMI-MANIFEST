manifest:

    remotes:
      - name: origin
        url-base: ssh://cn4soc.rtkbf.com:29418
      - name: gitee-ssh
        url-base: ssh://git@gitee.com
      - name: gitee
        url-base: ssh://git@gitee.com

    defaults:
      remote: origin

    projects:
      # SDK versions are based on the bb2u-sdk-hmi-v0.0.0.1 release manifest.
      # Display carries the accelerator API updates required by floating
      # HoneyGUI master; HoneyGUI itself intentionally tracks master.
      - name: zephyr
        repo-path: HoneyRepo/zephyr
        revision: 22ae46e7450b8ea4c46bb063e2e0b86caa43fd78
        path: zephyr
        import:
            file: test.yml
            path-prefix: zephyrproject
            name-allowlist:
              - cmsis
              - tinycrypt
              - mbedtls
              - fatfs

      - name: hal_realtek
        repo-path: HoneyRepo/zephyr-hal
        revision: b0ee865b621b07b476457c96d4aa65092912f7e8
        path: zephyrproject/modules/hal/realtek

      - name: realtek-app
        repo-path: HoneyRepo/realtek-zephyr-project
        revision: 021abd84621423591eb59644e2198e5890df6c83
        path: zephyrproject/realtek-app

      - name: display
        repo-path: HoneyRepo/driver/display
        revision: 3b42a79b50ecdee6729d58551da1d33c31c182ff
        path: zephyrproject/modules/display

      - name: honeygui
        repo-path: HoneyGUI
        revision: master
        path: zephyrproject/modules/honeygui

      - name: hmi
        repo-path: HoneyRepo/hmi
        revision: RTL8773G-eBadge-WH
        path: applications

      - name: hmi-script
        repo-path: HoneyRepo/hmi
        revision: script
        path: applications/scripts

      - name: rtl87x3-hmi-posix
        repo-path: HoneyRepo/hmi
        revision: posix-device
        path: posix

      - name: rtl87x3-hmi-protocol
        repo-path: HoneyRepo/hmi
        revision: rtl87x3-hmi-protocol
        path: protocol

      - name: FlashDB
        repo-path: HoneyRepo/hmi
        revision: FlashDB
        path: FlashDB

      - name: gsensor-algorithm
        remote: gitee-ssh
        repo-path: realmcu_admin/gsensor-algorithm
        revision: master
        path: gsensor-algorithm

      - name: watch_ui
        remote: gitee
        repo-path: priodigit/smartwatchui360360
        revision: master
        path: ui


    self:
        path: .manifest
