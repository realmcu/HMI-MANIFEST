manifest:

    remotes:
      - name: github
        url-base: https://github.com
      - name: gitee
        url-base: ssh://git@gitee.com

    defaults:
      remote: github

    projects:
      - name: rtl87x3g-watch-sdk
        repo-path: rtkconnectivity/rtl87x3g-zsdk
        revision: watch/v1.14.3.2
        path: zephyrproject/realtek-app
        import:
            file: west.yml
            path-prefix: .
            name-allowlist:
              - cmsis
              - fatfs
              - hal_realtek
              - mbedtls
              - tinycrypt
              - zephyr

      - name: honeygui
        repo-path: realmcu/HoneyGUI
        revision: master
        path: zephyrproject/modules/honeygui

      - name: display
        repo-path: realmcu/display
        revision: master
        path: zephyrproject/modules/display

      - name: hmi
        repo-path: realmcu/hmi
        revision: RTL8773G-eBadge-WH
        path: applications

      - name: hmi-script
        repo-path: realmcu/hmi
        revision: script
        path: applications/scripts

      - name: rtl87x3-hmi-posix
        repo-path: realmcu/hmi
        revision: posix-device
        path: posix

      - name: rtl87x3-hmi-protocol
        repo-path: realmcu/hmi
        revision: rtl87x3-hmi-protocol
        path: protocol

      - name: FlashDB
        repo-path: realmcu/hmi
        revision: FlashDB
        path: FlashDB

      - name: watch_ui
        remote: gitee
        repo-path: priodigit/smartwatchui360360
        revision: master
        path: ui


    self:
        path: .manifest
