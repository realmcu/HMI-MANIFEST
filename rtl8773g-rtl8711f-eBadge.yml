manifest:

    remotes:
      - name: origin
        url-base: ssh://cn4soc.rtkbf.com:29418
      - name: gitee
        url-base: ssh://git@gitee.com

    defaults:
      remote: origin

    projects:
      - name: zephyr
        repo-path: HoneyRepo/zephyr
        revision: realtek-main-v3.7
        path: zephyr
        import:
            path-prefix: zephyrproject
            name-allowlist:
              - cmsis
              - tinycrypt
              - mbedtls
              - fatfs

      - name: hal_realtek
        repo-path: HoneyRepo/zephyr-hal
        revision: master
        path: zephyrproject/modules/hal/realtek

      - name: realtek-app
        repo-path: HoneyRepo/realtek-zephyr-project
        revision: master
        path: zephyrproject/realtek-app

      - name: display
        repo-path: HoneyRepo/driver/display
        revision: master
        path: zephyrproject/modules/display

      - name: honeygui
        repo-path: HoneyGUI
        revision: master
        path: zephyrproject/modules/honeygui

      - name: hmi
        repo-path: HoneyRepo/hmi
        revision: rtl8773g-rtl8711f-eBadge-jelly
        path: zephyrproject/realtek-app/applications/eBadge_8773g_8711f
        west-commands: west_commands_extention/west-commands.yml

      - name: ui
        remote: gitee                         
        repo-path: ShelDeng1/mi-ebadge
        revision: master                         
        path: zephyrproject/realtek-app/applications/eBadge_8773g_8711f/app/designer

      - name: rtl87x3-hmi-protocol
        repo-path: HoneyRepo/hmi
        revision: rtl87x3-hmi-protocol
        path: zephyrproject/realtek-app/applications/eBadge_8773g_8711f/component/protocol


      - name: FlashDB
        repo-path: HoneyRepo/hmi
        revision: FlashDB
        path: zephyrproject/realtek-app/applications/eBadge_8773g_8711f/component/FlashDB

      - name: poxis-device
        repo-path: HoneyRepo/hmi
        revision: posix-device
        path: zephyrproject/realtek-app/applications/eBadge_8773g_8711f/component/posix-device


    self:
        path: .manifest
