manifest:

    remotes:
      - name: origin
        url-base: ssh://cn4soc.rtkbf.com:29418
      - name: gitee
        url-base: ssh://git@gitee.com
      - name: github
        url-base: ssh://git@github.com

    defaults:
      remote: origin

    projects:
      - name: zephyr
        repo-path: HoneyRepo/zephyr
        revision: realtek-main-v3.7
        path: zephyr
        import:
            path-prefix: zephyrproject
            name-allowlist:
              - cmsis
              - tinycrypt
              - mbedtls
              - fatfs

      - name: hal_realtek
        repo-path: HoneyRepo/zephyr-hal
        revision: master
        path: zephyrproject/modules/hal/realtek

      - name: realtek-app
        repo-path: HoneyRepo/realtek-zephyr-project
        revision: master
        path: zephyrproject/realtek-app

      - name: display
        repo-path: HoneyRepo/driver/display
        revision: master
        path: zephyrproject/modules/display

      - name: honeygui
        repo-path: HoneyGUI
        revision: master
        path: zephyrproject/modules/honeygui

      - name: hmi
        repo-path: HoneyRepo/hmi
        revision: rtl8773g-eBadge
        path: zephyrproject/realtek-app/applications/eBadge_8773g
        west-commands: west_commands_extention/west-commands.yml

      - name: ui
        remote: github                         
        repo-path: realmcu/honeygui-template-EBadge 
        revision: main                         
        path: zephyrproject/realtek-app/applications/eBadge_8773g/app/designer

      - name: rtl87x3-hmi-protocol
        repo-path: HoneyRepo/hmi
        revision: rtl87x3-hmi-protocol
        path: zephyrproject/realtek-app/applications/eBadge_8773g/component/protocol


      - name: FlashDB
        remote: gitee
        repo-path: RealMCU/FlashDB
        revision: master
        path: zephyrproject/realtek-app/applications/eBadge_8773g/component/FlashDB

      - name: poxis-device
        repo-path: HoneyRepo/hmi
        revision: posix-device
        path: zephyrproject/realtek-app/applications/eBadge_8773g/component/posix-device


    self:
        path: .manifest
