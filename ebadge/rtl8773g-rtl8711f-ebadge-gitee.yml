manifest:

    remotes:
      - name: github
        url-base: https://github.com
      - name: gitee
        url-base: ssh://git@gitee.com


    defaults:
      remote: gitee

    projects:
      - name: rtl87x3g-common-sdk
        remote: github
        repo-path: rtkconnectivity/rtl87x3g-zsdk
        revision: common/v1.0.0.21
        path: zephyrproject/realtek-app
        import:
            file: west.yml
            path-prefix: .
            name-allowlist:
              - cmsis
              - fatfs
              - hal_realtek
              - mbedtls
              - tinycrypt
              - zephyr
    

      - name: honeygui
        remote: gitee
        repo-path: realmcu/HoneyGUI
        revision: master
        path: zephyrproject/modules/honeygui
        
      - name: display
        repo-path: realmcu/display
        revision: master
        path: zephyrproject/modules/display

      - name: hmi
        repo-path: realmcu/hmi
        revision: rtl8773g-rtl8711f-eBadge-jelly
        path: zephyrproject/realtek-app/applications/eBadge_8773g_8711f
        west-commands: west_commands_extention/west-commands.yml

      - name: hmi-script
        repo-path: realmcu/hmi
        revision: script
        path: zephyrproject/realtek-app/applications/eBadge_8773g_8711f/scripts

      - name: ui
        remote: gitee                         
        repo-path: ShelDeng1/mi-ebadge
        revision: master                         
        path: zephyrproject/realtek-app/applications/eBadge_8773g_8711f/app/designer

      - name: FlashDB
        remote: gitee
        repo-path: realmcu/hmi
        revision: FlashDB
        path: zephyrproject/realtek-app/applications/eBadge_8773g_8711f/component/FlashDB

      - name: poxis-device
        remote: gitee
        repo-path: realmcu/hmi
        revision: posix-device
        path: zephyrproject/realtek-app/applications/eBadge_8773g_8711f/component/posix-device


    self:
        path: .manifest
