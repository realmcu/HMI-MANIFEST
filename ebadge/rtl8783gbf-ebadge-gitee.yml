manifest:

    remotes:
      - name: github
        url-base: https://github.com
      - name: gitee
        url-base: ssh://git@gitee.com

    defaults:
      remote: gitee

    projects:
      - name: rtl87x3g-common-sdk
        remote: github
        repo-path: rtkconnectivity/rtl87x3g-zsdk
        revision: common/v1.0.0.21
        path: zephyrproject/realtek-app
        import:
            file: west.yml
            path-prefix: .
            name-allowlist:
              - cmsis
              - fatfs
              - hal_realtek
              - mbedtls
              - tinycrypt
              - zephyr

      - name: display
        repo-path: realmcu/display
        revision: 82c8e046412a226d825815ea1e687912a7b387e1
        path: zephyrproject/modules/display

      - name: honeygui
        repo-path: realmcu/HoneyGUI
        revision: ebe9378874810fd86c239f1def9488878257be6f
        path: zephyrproject/modules/honeygui

      - name: hmi
        repo-path: realmcu/hmi
        revision: d4a66894904d67d5427373020f26c58f7211674e
        path: zephyrproject/realtek-app/applications/eBadge
        west-commands: west_commands_extention/west-commands.yml

      - name: ui                     
        repo-path: realmcu/honeygui-template-EBadge 
        revision: b34c0fab7b9a174a9a44dac38e47b9a4c9a68443
        path: zephyrproject/realtek-app/applications/eBadge/app/designer 

      - name: rtl87x3-hmi-protocol
        repo-path: realmcu/hmi
        revision: 605897370eb2874eea5ee0c5b40b5fe5f7eb150d
        path: zephyrproject/realtek-app/applications/eBadge/component/protocol

      - name: FlashDB
        repo-path: realmcu/hmi
        revision: FlashDB
        path: zephyrproject/realtek-app/applications/eBadge/component/FlashDB

    self:
        path: .manifest
