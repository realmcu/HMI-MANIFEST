manifest:

    remotes:
      - name: origin
        url-base: https://github.com

    defaults:
      remote: origin

    projects:
      - name: rtl87x3ep-mcu-hmi-sdk
        repo-path: realmcu/rtl87x3ep-mcu-hmi-sdk
        revision: master
        path: RTL8773EP

      - name: hmi
        repo-path: realmcu/hmi
        revision: rtl8773e-eBadge
        path: RTL8773EP/board/evb/eBadge

      - name: rtl87x3-hmi-protocol
        repo-path: realmcu/hmi
        revision: rtl87x3-hmi-protocol
        path: RTL8773EP/board/evb/eBadge/component/protocol

      - name: FlashDB
        repo-path: realmcu/hmi
        revision: FlashDB
        path: RTL8773EP/board/evb/eBadge/component/FlashDB

      - name: Wearable
        repo-path: realmcu/wearable
        revision: master
        path: RTL8773EP/src/app/Wearable/

      - name: ui
        repo-path: realmcu/honeygui-template-EBadge
        revision: main
        path: RTL8773EP/board/evb/eBadge/app/designer

    self:
        path: .manifest
