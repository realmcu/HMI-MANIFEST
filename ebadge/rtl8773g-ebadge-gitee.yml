manifest:

    remotes:
      - name: github
        url-base: https://github.com
      - name: gitee
        url-base: ssh://git@gitee.com


    defaults:
      remote: gitee

    projects:
      - name: rtl87x3g-common-sdk
        remote: github
        repo-path: rtkconnectivity/rtl87x3g-zsdk
        revision: common/v1.0.0.21
        path: zephyrproject/realtek-app
        import:
            file: west.yml
            path-prefix: .
            name-allowlist:
              - cmsis
              - fatfs
              - hal_realtek
              - mbedtls
              - tinycrypt
              - zephyr
    

      - name: honeygui
