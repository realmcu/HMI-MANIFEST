manifest:

    remotes:
      - name: gitee
        url-base: ssh://git@gitee.com
      - name: upstream
        url-base: https://github.com/zephyrproject-rtos
      - name: arm-software
        url-base: https://github.com/ARM-software

    defaults:
      remote: gitee

    projects:
      - name: rtl87x3g-hmi-sdk
        repo-path: realmcu/rtl87x3g-hmi-sdk
        revision: master
        path: zephyrproject

      - name: display
        repo-path: realmcu/display
        revision: master
        path: zephyrproject/modules/display

      - name: honeygui
        repo-path: realmcu/HoneyGUI
        revision: master
        path: zephyrproject/modules/honeygui

      - name: hmi
        repo-path: realmcu/hmi
        revision: RTL8773G-eBadge-WH
        path: applications

      - name: hmi-script
        repo-path: realmcu/hmi
        revision: script
        path: applications/scripts

      - name: rtl87x3-hmi-posix
        repo-path: realmcu/hmi
        revision: posix-device
        path: applications/component/posix

      - name: rtl87x3-hmi-protocol
        repo-path: realmcu/hmi
        revision: rtl87x3-hmi-protocol
        path: applications/component/protocol

      - name: FlashDB
        repo-path: realmcu/hmi
        revision: FlashDB
        path: applications/component/FlashDB

      - name: gsensor-algorithm
        repo-path: realmcu_admin/gsensor-algorithm
        revision: master
        path: applications/component/gsensor-algorithm


    self:
        path: .manifest
