manifest:

    remotes:
      - name: origin
        url-base: ssh://cn4soc.rtkbf.com:29418

    defaults:
      remote: origin

    projects:
      - name: zephyr
        repo-path: HoneyRepo/zephyr
        revision: realtek-main-v3.7
        path: zephyr
        import:
            path-prefix: zephyrproject
            name-allowlist:
              - cmsis
              - tinycrypt
              - mbedtls
              - fatfs

      - name: hal_realtek
        repo-path: HoneyRepo/zephyr-hal
        revision: master
        path: zephyrproject/modules/hal/realtek

      - name: realtek-app
        repo-path: HoneyRepo/realtek-zephyr-project
        revision: master
        path: zephyrproject/realtek-app

      - name: display
        repo-path: HoneyRepo/driver/display
        revision: master
        path: zephyrproject/modules/display

      - name: wearable
        repo-path: Wearable
        revision: master
        path: zephyrproject/modules/wearable

      - name: honeygui
        repo-path: HoneyGUI
        revision: master
        path: zephyrproject/modules/honeygui

      - name: hmi
        repo-path: HoneyRepo/hmi
        revision: rtl8773g-deskmate
        path: zephyrproject/realtek-app/applications/deskmate
        west-commands: west_commands_extention/west-commands.yml

      - name: rtl87x3-eBadge
        repo-path: HoneyRepo/hmi
        revision: rtl87x3-eBadge
        path: zephyrproject/realtek-app/applications/deskmate/transport

    self:
        path: .manifest
