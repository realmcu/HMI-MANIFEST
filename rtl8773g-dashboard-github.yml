manifest:

    remotes:
      - name: github
        url-base: https://github.com

    defaults:
      remote: github

    projects:
      - name: rtl87x3g-hmi-sdk
        repo-path: realmcu/rtl87x3g-hmi-sdk
        revision: master
        path: zephyrproject

      - name: display
        repo-path: realmcu/display
        revision: master
        path: zephyrproject/modules/display

      - name: honeygui
        repo-path: realmcu/HoneyGUI
        revision: master
        path: zephyrproject/modules/honeygui

      - name: hmi
        repo-path: realmcu/hmi
        revision: rtl8773g-dashboard
        path: zephyrproject/realtek-app/applications/dashboard

    self:
        path: .manifest
