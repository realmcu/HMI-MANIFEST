manifest:

    remotes:
      - name: origin
        url-base: https://github.com

    defaults:
      remote: origin

    projects:
      - name: rtl87x2g-hmi-sdk
        repo-path: realmcu/rtl87x2g-hmi-sdk
        revision: master
        path: sdk

      - name: wearable
        repo-path: realmcu/wearable
        revision: master
        path: sdk/subsys/wearable

      - name: lvgl
        repo-path: realmcu/lvgl
        revision: lvgl_v9
        path: sdk/subsys/lvgl

      - name: display
        repo-path: realmcu/display
        revision: master
        path: sdk/subsys/display

      - name: hmi
        repo-path: realmcu/hmi
        revision: rtl87x2g-lvgl-hmi
        path: sdk/applications/lvgl

    self:
        path: .manifest
