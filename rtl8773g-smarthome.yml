manifest:

    remotes:
      - name: origin
        url-base: ssh://cn4soc.rtkbf.com:29418
      - name: gitee
        url-base: https://gitee.com

    defaults:
      remote: origin

    projects:
      - name: zephyr
        repo-path: HoneyRepo/zephyr
        revision: realtek-main-v3.7
        path: zephyr
        import:
            path-prefix: zephyrproject
            name-allowlist:
              - cmsis
              - tinycrypt
              - mbedtls
              - fatfs

      - name: hal_realtek
        repo-path: HoneyRepo/zephyr-hal
        revision: master
        path: zephyrproject/modules/hal/realtek

      - name: realtek-app
        repo-path: HoneyRepo/realtek-zephyr-project
        revision: master
        path: zephyrproject/realtek-app

      - name: display
        repo-path: HoneyRepo/driver/display
        revision: master
        path: zephyrproject/modules/display

      - name: lvgl
        repo-path: HoneyRepo/lvgl
        revision: lvgl_v9
        path: zephyrproject/modules/lvgl

      - name: hmi
        repo-path: HoneyRepo/hmi
        revision: rtl8773g-smarthome
        path: zephyrproject/realtek-app/applications/smarthome

      - name: rtl87x3-hmi-posix
        repo-path: HoneyRepo/hmi
        revision: posix-device
        path: zephyrproject/realtek-app/applications/smarthome/component/posix

      - name: FlashDB
        remote: gitee
        repo-path: RealMCU/FlashDB
        revision: master
        path: zephyrproject/realtek-app/applications/smarthome/component/FlashDB


    self:
        path: .manifest
